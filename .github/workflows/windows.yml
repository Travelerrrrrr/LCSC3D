name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      # Hosted Windows runners use a virtual GPU that Chromium blocklists.
      QTWEBENGINE_CHROMIUM_FLAGS: '--ignore-gpu-blocklist'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-test.txt
      - name: Install dependencies
        run: python -m pip install -r app/requirements-test.txt
      - name: Run Material UI preflight
        timeout-minutes: 5
        shell: pwsh
        run: |
          $verification = Join-Path $pwd 'work/material-preflight'
          New-Item -ItemType Directory -Force $verification | Out-Null
          Copy-Item -Recurse app/tests/fixtures (Join-Path $verification 'fixtures')
          $env:LOCALAPPDATA = Join-Path $verification 'LocalAppData'
          python app/main.py --self-test-material $verification 2>&1 | Tee-Object -FilePath (Join-Path $verification 'stdout.log')
          if ($LASTEXITCODE -ne 0) { throw 'Material UI preflight failed' }
          $report = Get-Content (Join-Path $verification 'material-verification.json') -Raw | ConvertFrom-Json
          if (-not $report.success) { throw 'Material UI verification failed' }
      - name: Run regression tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work | Out-Null
          $env:LOCALAPPDATA = Join-Path $pwd 'work/unit-profile'
          $env:TEMP = Join-Path $env:LOCALAPPDATA 'LCSC3D/temp'
          $env:TMP = $env:TEMP
          New-Item -ItemType Directory -Force $env:TEMP | Out-Null
          python -m unittest discover -s app/tests -v 2>&1 | Tee-Object -FilePath work/unit-tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed' }
      - name: Build portable application
        working-directory: app
        run: python -m PyInstaller --noconfirm --clean LCSC3D.spec
      - name: Verify final executable and package release assets
        run: python scripts/verify_release.py
      - name: Preserve and validate release evidence
        run: |
          Copy-Item -LiteralPath work/release-verification/release-verification.json -Destination outputs/release-verification.json
          Copy-Item -LiteralPath work/release-verification/pdf-downloads/LocalAppData/LCSC3D/verification/pdf-verification.json -Destination outputs/pdf-verification.json
          Copy-Item -LiteralPath work/release-verification/progress/LocalAppData/LCSC3D/verification/progress-verification.json -Destination outputs/progress-verification.json
          $versionMatch = Select-String -LiteralPath app/lcsc3d/ui/main.py -Pattern "^VERSION = '([^']+)'"
          $version = $versionMatch.Matches[0].Groups[1].Value
          python scripts/verify_release_assets.py --directory outputs --version $version --commit $env:GITHUB_SHA --report work/release-verification/publish-verification.json
          if ($LASTEXITCODE -ne 0) { throw 'Release asset verification failed' }
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: LCSC3D-Windows-x64
          path: outputs/LCSC3D.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: LCSC3D-verification
          path: |
            work/unit-tests.log
            work/material-preflight/*.json
            work/material-preflight/*.png
            work/material-preflight/*.log
            work/material-preflight/logs/*.log
            work/release-verification/**/*.log
            work/release-verification/**/*verification.json
            work/release-verification/material-ui/LocalAppData/LCSC3D/verification/*.png
            work/release-verification/pdf-downloads/LocalAppData/LCSC3D/verification/*.png
            work/release-verification/progress/LocalAppData/LCSC3D/verification/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: LCSC3D-release-assets
          path: |
            outputs/LCSC3D.exe
            outputs/LCSC3D.zip
            outputs/SHA256SUMS.txt
            outputs/使用说明.md
            outputs/release-verification.json
            outputs/pdf-verification.json
            outputs/progress-verification.json
          if-no-files-found: error
