name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      # Hosted Windows runners use a virtual GPU that Chromium blocklists.
      QTWEBENGINE_CHROMIUM_FLAGS: '--ignore-gpu-blocklist'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-test.txt
      - name: Install dependencies
        run: python -m pip install -r app/requirements-test.txt
      - name: Run regression tests
        run: python -m unittest discover -s app/tests -v
      - name: Build portable application
        working-directory: app
        run: python -m PyInstaller --noconfirm --clean LCSC3D.spec
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: LCSC3D-Windows-x64
          path: app/dist/LCSC3D.exe
          if-no-files-found: error
