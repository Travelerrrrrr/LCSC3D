name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r app/requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s app/tests -v
      - name: Build portable application
        working-directory: app
        run: python -m PyInstaller --noconfirm --clean LCSC3D.spec
      - uses: actions/upload-artifact@v4
        with:
          name: LCSC3D-Windows-x64
          path: app/dist/LCSC3D.exe
          if-no-files-found: error
